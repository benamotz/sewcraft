# Render Blueprint: a free static site built from this repo (New → Blueprint in the Render dashboard).
services:
  - type: web
    runtime: static
    name: sewcraft
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    pullRequestPreviewsEnabled: false
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
